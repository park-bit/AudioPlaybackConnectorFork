name: Build

on:
  push:
    tags: [ '**' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Setup translations
      run: |
        git config --global url."https://github.com/".insteadOf git://github.com/
        cd translate
        pip install -r requirements.txt
        ./gen_rc.sh
      shell: bash
    - name: NuGet restore
      run: nuget restore AudioPlaybackConnector.sln
    - name: Build x64
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x64 -v:minimal
      shell: powershell
    - name: Build x86
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x86 -v:minimal
      shell: powershell
    - name: Upload x64
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector64
        path: x64/Release/AudioPlaybackConnector64.exe
        if-no-files-found: error
    - name: Upload x86
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector32
        path: Release/AudioPlaybackConnector32.exe
        if-no-files-found: warn
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          x64/Release/AudioPlaybackConnector64.exe
          Release/AudioPlaybackConnector32.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
